<script>
    for(let i = 0; i < 5; i++) {
        for(let j = 0; j<=i; j++) {
            document.write("*");
        }
        document.write('<br>');
    }

    let list = [10, 5, 2, 30, 15];
    let max = list[0];
    for(let i = 1; i < list.length; i++) {
        if(list[i] > max) {
            max = list[i];
        }
    }
    document.write("최대 값은 : " + max + "<br>");

</script>
